[package]
name = "themis-topology"
version = "0.10.1"
edition = "2021"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryancinsight/themis"
homepage = "https://github.com/ryancinsight/themis"
documentation = "https://docs.rs/themis-topology"
description = "Typed placement law for NUMA, HBM, memory-tier, and worker locality contracts"
keywords = ["numa", "hbm", "locality", "placement", "topology"]
categories = ["concurrency", "memory-management", "hardware-support"]
rust-version = "1.81.0"

[lib]
name = "themis"

[features]
default = ["std", "melinoe"]
std = ["melinoe", "melinoe/std"]
# Branded placement extras
melinoe = ["dep:melinoe", "melinoe/alloc"]
# Test-only surface: activates `new_for_test` constructors and table-builder
# re-exports so integration tests in `tests/` can construct fixed topologies.
# `#[cfg(test)]` alone is insufficient because integration tests consume the
# lib as a regular dependency (lib is built with `--cfg test=false`).
# `testing` implies `std` because the table builders (`build_processor_to_node`,
# `build_default_distance_row`) and `cache::detect_cache_levels` are
# std-gated; no-std + testing would otherwise be an unbuildable combination.
testing = ["std"]

[workspace]
members = ["."]
default-members = ["."]
resolver = "2"

[lints]
workspace = true

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }

# Pedantic floor ratchet: every class listed below already fires in this
# workspace and is allowed at its measured baseline; every class NOT listed
# is a hard error. Counts are `cargo clippy --all-targets` hits at the time
# the floor was established (total / production, production excluding
# `#[cfg(test)]` modules and test, bench and example targets). Burn a class
# down to zero, then delete its line -- the floor tightens, never loosens.
#
# The ratchet is empty: the only class that fired was `similar_names`
# (5 sites, 0 in production, all in tests/branded.rs, where index-suffixed
# names -- `permit0`/`permit1`, `cell0`/`cell1` -- are the clearest way to
# write per-NUMA-node pairs). It is pinned by a file-level `#![expect(...)]`
# in that one file rather than allowed workspace-wide, so the pin self-expires
# when the last such pair goes.

# --- Restriction floor ---
# Themis is a library: an input-dependent `unwrap` is a panic in a consumer's
# process. Denied outright with no ratchet -- zero production sites.
unwrap_used = "deny"
# A library never writes to the process's stdio; output belongs to the caller.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

[dependencies]
melinoe = { git = "https://github.com/ryancinsight/melinoe.git", version = "0.9.0", default-features = false, optional = true }

[dev-dependencies]
proptest = "1"
trybuild = "1"

[[test]]
name = "branded"
path = "tests/branded.rs"
required-features = ["melinoe", "testing"]

[[test]]
name = "compile_fail"
path = "tests/compile_fail.rs"
required-features = ["melinoe"]

[[test]]
name = "cpu_topology"
path = "tests/topology/cpu/main.rs"
required-features = ["testing"]

[[bench]]
name = "topology"
harness = false
