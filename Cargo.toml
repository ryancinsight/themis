[package]
name = "themis"
version = "0.9.17"
edition = "2021"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryancinsight/themis"
homepage = "https://github.com/ryancinsight/themis"
documentation = "https://docs.rs/themis"
description = "Typed placement law for NUMA, HBM, memory-tier, and worker locality contracts"
keywords = ["numa", "hbm", "locality", "placement", "topology"]
categories = ["concurrency", "memory-management", "hardware-support"]
rust-version = "1.75.0"

[features]
default = ["std", "melinoe"]
std = ["melinoe?/std"]
# Branded placement extras
melinoe = ["dep:melinoe"]

[dependencies]
melinoe = { git = "https://github.com/ryancinsight/melinoe.git", version = "0.9.0", default-features = false, optional = true }

[dev-dependencies]
proptest = "1"

[[bench]]
name = "topology"
harness = false
