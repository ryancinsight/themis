[package]
name = "themis-topology"
version = "0.10.1"
edition = "2021"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryancinsight/themis"
homepage = "https://github.com/ryancinsight/themis"
documentation = "https://docs.rs/themis-topology"
description = "Typed placement law for NUMA, HBM, memory-tier, and worker locality contracts"
keywords = ["numa", "hbm", "locality", "placement", "topology"]
categories = ["concurrency", "memory-management", "hardware-support"]
rust-version = "1.75.0"

[lib]
name = "themis"

[features]
default = ["std", "melinoe"]
std = ["melinoe?/std"]
# Branded placement extras
melinoe = ["dep:melinoe", "melinoe/alloc"]
# Test-only surface: activates `new_for_test` constructors and table-builder
# re-exports so integration tests in `tests/` can construct fixed topologies.
# `#[cfg(test)]` alone is insufficient because integration tests consume the
# lib as a regular dependency (lib is built with `--cfg test=false`).
# `testing` implies `std` because the table builders (`build_processor_to_node`,
# `build_default_distance_row`) and `cache::detect_cache_levels` are
# std-gated; no-std + testing would otherwise be an unbuildable combination.
testing = ["std"]

[dependencies]
melinoe = { git = "https://github.com/ryancinsight/melinoe.git", version = "0.9.0", default-features = false, optional = true }

[dev-dependencies]
proptest = "1"

[[test]]
name = "branded"
path = "tests/branded.rs"
required-features = ["melinoe", "testing"]

[[bench]]
name = "topology"
harness = false
