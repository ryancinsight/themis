[package]
name = "themis"
version = "0.8.0"
edition = "2021"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryancinsight/themis"
homepage = "https://github.com/ryancinsight/themis"
documentation = "https://docs.rs/themis"
description = "Typed placement law for NUMA, HBM, memory-tier, and worker locality contracts"
keywords = ["numa", "hbm", "locality", "placement", "topology"]
categories = ["concurrency", "memory-management", "hardware-support"]
rust-version = "1.75.0"

[features]
default = ["std", "parallel", "mnemosyne-memory", "melinoe"]
std = ["melinoe/std"]
parallel = []
mnemosyne-memory = []
# Branded placement extras; the melinoe dependency itself is unconditional
# (thread_cached!, placement law utilities).
melinoe = []

[dependencies]
melinoe = { git = "https://github.com/ryancinsight/melinoe.git", version = "0.7.0", default-features = false }
